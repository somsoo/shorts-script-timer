  <h1>숏폼 대본 타이머 소개</h1>
  <p>짧은 영상 대본을 붙여 넣으면 글자 수를 세어 내 읽기 속도로 몇 초가 걸리는지 계산하고, 속도에 맞춰 흐르는 프롬프터로 읽을 수 있게 해 주는 무료 도구입니다.</p>
  <p>시간은 글자 수 ÷ 분당 읽기 속도에 [쉼] 시간을 더해 구합니다. 표준 읽기 속도를 내세우지 않으며, 내 속도를 직접 재서 쓰도록 만들었습니다. 계산은 모두 브라우저 안에서 하고 대본은 운영자에게 보내지 않습니다.</p>
