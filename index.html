<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유튜브 쇼츠 대본 길이 측정기</title>
    <meta name="description" content="쇼츠 60초 안에 들어가는 대본 소요 시간을 계산합니다.">
    <style>
        body { font-family: 'Pretendard', sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f9fafb; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; margin-top: 50px; }
        h1 { color: #111827; font-size: 24px; }
        p { color: #4b5563; line-height: 1.6; }
        .ad-slot { width: 100%; height: 100px; background: #e5e7eb; display: flex; align-items: center; justify-content: center; color: #9ca3af; margin: 20px 0; border-radius: 10px; border: 1px dashed #9ca3af; }
        .btn-share { background: #fee500; color: #000; padding: 15px 20px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .coupang-banner { width: 100%; height: 80px; background: #ff3131; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-top: 20px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2228289204702106" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2228289204702106" crossorigin="anonymous"></script>
    
    <div class="card">
        <h1>유튜브 쇼츠 대본 길이 측정기</h1>
        <p>쇼츠 60초 안에 들어가는 대본 소요 시간을 계산합니다.</p>
        
        <p>API 에러 발생으로 로직을 불러오지 못했습니다.</p>

        <button class="btn-share" onclick="shareApp()">
            앱 공유하기 (Web Share API)
        </button>
    </div>

    <div class="coupang-banner">쿠팡 파트너스 맞춤형 기획전 배너</div>
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2228289204702106" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2228289204702106" crossorigin="anonymous"></script>

    <!-- JSON-LD 구조화 데이터 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "유튜브 쇼츠 대본 길이 측정기",
      "description": "쇼츠 60초 안에 들어가는 대본 소요 시간을 계산합니다.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "WebBrowser"
    }
    </script>

    <script>
        // 카카오 API 필요 없는 Web Share API 공유 로직
        function shareApp() {
            if (navigator.share) {
                navigator.share({
                    title: '유튜브 쇼츠 대본 길이 측정기',
                    text: '쇼츠 60초 안에 들어가는 대본 소요 시간을 계산합니다.',
                    url: window.location.href
                }).then(() => console.log('Successful share'))
                  .catch((error) => console.log('Error sharing', error));
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("링크가 복사되었습니다! 카카오톡에 붙여넣기 해주세요.");
            }
        }
    </script>
</body>
</html>
